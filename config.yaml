# MVP 2.9.11 — OHLC intradía token + BTC
# Objetivo: validar solo los mejores candidatos, sin hacer pesado el scan.
ohlc_validator:
  enabled: true
  output_dir: outputs/ohlc
  # Solo se descarga OHLC para los 10 mejores candidatos actuales y 10 mejores históricos pendientes.
  current_top_n: 10
  historical_top_n: 10
  # Para trading intradía con proyección hasta 3 días.
  horizon_hours:
  - 24
  - 72
  interval_intraday: 15m
  interval_swing: 1h
  # Prioriza el exchange original; para nuestras señales actuales LBank suele ser la fuente principal.
  # CoinGeckoRange queda como fallback preliminar para cruzar histórico cuando el exchange está bloqueado.
  preferred_exchanges:
  - LBank
  - Binance
  - Bybit
  - CoinGeckoRange
  quote_asset: USDT
  btc_symbol: BTCUSDT
  max_lookback_days: 45
  request_timeout_seconds: 20
  retry_attempts: 2
  retry_sleep_seconds: 1.0
  blocked_retry_attempts: 0
  target_thresholds_pct:
  - 2
  - 5
  - 10
  - 15
  - 20
  estimated_round_trip_cost_pct: 0.25
  # Filtro de selección para no descargar OHLC de descartados/observaciones.
  eligible_operational_buckets:
  - prioridad_operativa
  - candidato_activo
  - rebote_tactico
  - vigilar
  eligible_track_buckets:
  - A+
  - A_T1
  - A
  - B_HIGH_SCORE
  - B_TREND
  # Si el histórico viene de una versión vieja, se acepta solo para backfill preliminar.
  allow_legacy_backfill: true
