name: T07 Tesoreria - public API connectivity probe

# One-shot branch-only probe. No schedule, dispatch, keys or account access.
on:
  push:
    branches:
      - 'test/tesoreria-public-api-20261121'
    paths:
      - '.github/workflows/tesoreria_public_api_probe.yml'

permissions: {}
concurrency:
  group: t07-public-api-probe
  cancel-in-progress: true

jobs:
  connectivity:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Probe public endpoints (no account credentials)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          endpoints = [
              ("Binance main REST ping", "https://api.binance.com/api/v3/ping", "binance-ping"),
              ("Binance market-only ping", "https://data-api.binance.vision/api/v3/ping", "binance-ping"),
              ("Binance main ONDOUSDT ticker", "https://api.binance.com/api/v3/ticker/price?symbol=ONDOUSDT", "binance-ticker"),
              ("Bybit market time", "https://api.bybit.com/v5/market/time", "bybit-time"),
              ("Bybit ONDOUSDT Spot ticker", "https://api.bybit.com/v5/market/tickers?category=spot&symbol=ONDOUSDT", "bybit-ticker"),
          ]

          def valid(obj, kind):
              if kind == "binance-ping":
                  return isinstance(obj, dict) and "code" not in obj
              if kind == "binance-ticker":
                  return isinstance(obj, dict) and obj.get("symbol") == "ONDOUSDT" and float(obj.get("price", 0)) > 0
              if kind == "bybit-time":
                  return isinstance(obj, dict) and obj.get("retCode") == 0
              if kind == "bybit-ticker":
                  return (isinstance(obj, dict) and obj.get("retCode") == 0
                          and isinstance(obj.get("result", {}).get("list"), list)
                          and any(x.get("symbol") == "ONDOUSDT"
                                  for x in obj["result"]["list"]))
              return False

          overall = True
          results = []
          for label, url, kind in endpoints:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "TesoreriaPublicProbe/1.0", "Accept": "application/json"})
                  with urllib.request.urlopen(req, timeout=6) as response:
                      http_status = response.status
                      payload = response.read(32768)
                  parsed = json.loads(payload.decode("utf-8"))
                  ok = http_status == 200 and valid(parsed, kind)
                  outcome = "PASS" if ok else "FAIL"
                  msg = f"{outcome} | HTTP {http_status} | {label}"
              except urllib.error.HTTPError as exc:
                  ok = False
                  msg = f"FAIL | HTTP {exc.code} | {label}"
              except Exception as exc:
                  ok = False
                  msg = f"FAIL | {type(exc).__name__} | {label}"
              print(msg, flush=True)
              results.append(msg)
              overall = overall and ok

          with open("/tmp/t07_probe_summary.md", "w", encoding="utf-8") as report:
              report.write("## Tesoreria T07 - Public API connectivity\n\n")
              report.write("No keys, no balances, no portfolio data. Market-access test only; **does not certify authenticated account API connectivity**.\n\n")
              report.write("\n".join("- " + line for line in results) + "\n")
              report.write("\nOverall: **" + ("PASS" if overall else "FAIL") + "**\n")
          with open("/tmp/t07_probe_summary.md", encoding="utf-8") as report:
              print(report.read())
          sys.exit(0 if overall else 1)
          PY
